<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chain-viz</title>
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header id="header" class="header">
  <div class="brand">
    <span class="title">chain-viz</span>
    <span id="chain-name" class="pill">…</span>
    <span id="conn" class="pill conn" data-state="connecting">connecting</span>
  </div>
  <div class="stats">
    <div class="stat"><span class="label">nodes up</span><span id="node-count" class="value">–</span></div>
    <div class="stat"><span class="label">tip</span><span id="tip" class="value">–</span></div>
    <div class="stat hero"><span class="label">since last block <span id="spacing" class="muted"></span></span><span id="since" class="value" data-level="0">–</span></div>
    <div class="stat"><span class="label">seq</span><span id="seq" class="value">–</span></div>
  </div>
</header>

<main class="grid">
  <section id="panel-chain" class="panel span-2">
    <div class="panel-head"><h2>Chain</h2><span class="hint">newest right · main row on top, side branches hang below their fork point</span></div>
    <div id="heads" class="chips" aria-label="per-node heads"></div>
    <div id="dag-wrap" class="dag-wrap"><svg id="dag" class="dag" role="img" aria-label="block DAG"></svg></div>
    <div class="row">
      <div id="gauges" class="gauges"></div>
      <div class="reorgs"><h3>Reorg log</h3><ol id="reorg-log" class="list"></ol></div>
    </div>
  </section>

  <section id="panel-mempool" class="panel">
    <div class="panel-head"><h2>Mempool</h2><span class="hint">fee rate × time in mempool</span></div>
    <div id="mempool-stats" class="tiles"></div>
    <svg id="mempool-plot" class="plot" role="img" aria-label="mempool scatter"></svg>
    <div id="mempool-legend" class="legend"></div>
    <details><summary>Table</summary><table id="mempool-table" class="table"></table></details>
  </section>

  <section id="panel-events" class="panel">
    <div class="panel-head"><h2>Events</h2>
      <label class="hint">kind <select id="event-filter"><option value="">all</option></select></label>
    </div>
    <ol id="event-log" class="list mono"></ol>
  </section>
</main>
<div id="tooltip" class="tooltip" hidden></div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
