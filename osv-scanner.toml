# OSV-Scanner policy (SECURITY-CI.md). Every entry: the advisory, why it does not reach a chain-viz
# release, and an ignoreUntil at most 90 days out, after which the scan fails again and the entry is
# re-checked. Cargo.lock advisories are fixed by a lockfile bump, never listed here.

# contrib/semgrep/requirements.txt is the hash-locked Semgrep CLI the semgrep workflow installs on
# the CI runner. It is a byte-for-byte copy of ycash-dd's (the same file in every Yellowback repo,
# contrib/semgrep/README.md), so it moves there first and is re-copied. None of it ships in chain-viz:
# semgrep runs with --metrics=off against pinned local rule checkouts and never starts its MCP server.
[[IgnoredVulns]]
id = "GHSA-6q48-6c7w-9gw2"
ignoreUntil = 2026-12-31
reason = "certifi 2026.7.22 (alias PYSEC-2026-4320) in the CI-only Semgrep toolchain (contrib/semgrep/requirements.txt, shared with ycash-dd); semgrep makes no outbound TLS calls in our scans (--metrics=off, no registry). Bump with the shared file."

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-12-31
reason = "mcp 1.29.0 in the CI-only Semgrep toolchain; the MCP server (semgrep mcp) is never started by scan.py. Bump with the shared file."

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2026-12-31
reason = "opentelemetry-api 1.37.0 in the CI-only Semgrep toolchain; tracing is off (--metrics=off, no OTEL endpoint configured). Bump with the shared file."
