[package]
name = "chain-viz"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only real-time x-ray of a Ycash chain and its Yellowback overlay (many nodes, one view)"
license = "MIT"

[lib]
name = "chain_viz"
path = "src/lib.rs"

[[bin]]
name = "chain-viz"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal", "fs"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
include_dir = "0.7"
zeromq = { version = "0.4", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
futures-util = "0.3"
base64 = "0.22"
hex = "0.4"

[profile.release]
opt-level = 2

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
